[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endpointer"
version = "0.1.0"
description = "Capture the API calls a web app makes from a browser, keep the ones that matter, graph their dependencies and spot drift."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6", "jsonschema>=4.21", "openapi-spec-validator>=0.7"]

[project.scripts]
endpointer = "endpointer.cli:main"
endpoint-checker = "endpoint_checker.cli:main"

[tool.setuptools]
packages = ["endpointer", "endpoint_checker"]

[tool.setuptools.package-data]
endpointer = ["ui/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP", "RUF", "PERF"]
ignore = [
    "E501",    # long strings in prompts and messages
    "PERF203", # try/except per item is deliberate
    "PERF401", # explicit loops read better in the report code
    "RUF001",  # deliberate unicode in output (·, —, …)
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
